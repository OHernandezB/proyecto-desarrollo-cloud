spring.application.name=login-service
server.port=${SERVER_PORT:8081}

# Base de datos (PostgreSQL o H2 por defecto)
spring.datasource.url=${DB_URL:jdbc:h2:mem:logindb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=true

# Hibernate / JPA
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración Microsoft Active Directory / MSAL
spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:false}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:tu-client-id-aqui}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_CLIENT_SECRET:tu-client-secret-aqui}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:common}
